<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>All Transactions · Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: auto;
            min-width: 0;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #007aff;
            font-weight: 600;
            text-decoration: none;
        }

        .empty-state {
            text-align: center;
            color: #777;
            padding: 20px 0;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 6px;
            color: #777;
            font-size: 13px;
            font-weight: 600;
        }

        .filter-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            background: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="index.html" class="back-link">← Back</a>

        <h1>All Transactions</h1>

        <div class="card">
            <div class="filters">
                <div class="filter-group">
                    <label for="monthSelect">Month</label>
                    <select id="monthSelect"></select>
                </div>
                <div class="filter-group">
                    <label for="yearSelect">Year</label>
                    <select id="yearSelect"></select>
                </div>
            </div>
            <div id="expenseList">
                Loading...
            </div>
        </div>

    </div>

    <script src="shared.js"></script>
    <script>
        const monthSelect = document.getElementById("monthSelect");
        const yearSelect = document.getElementById("yearSelect");
        const list = document.getElementById("expenseList");
        let allExpenses = [];

        for (let month = 0; month < 12; month++) {
            const monthValue = String(month + 1).padStart(2, "0");
            const monthName = new Date(2000, month, 1).toLocaleDateString("en-IN", {
                month: "long"
            });
            monthSelect.add(new Option(monthName, monthValue));
        }

        monthSelect.value = String(new Date().getMonth() + 1).padStart(2, "0");

        function renderTransactions() {
            const selectedMonth = `${yearSelect.value}-${monthSelect.value}`;
            const monthExpenses = allExpenses.filter(expense =>
                String(expense.date || "").startsWith(selectedMonth)
            );

            list.innerHTML = "";

            if (monthExpenses.length === 0) {
                const monthName = monthSelect.options[monthSelect.selectedIndex].text;
                list.innerHTML =
                    `<div class="empty-state">No transactions for ${monthName} ${yearSelect.value}.</div>`;
                return;
            }

            monthExpenses.forEach(expense => {
                list.appendChild(createExpenseItem(expense));
            });
        }

        monthSelect.addEventListener("change", renderTransactions);
        yearSelect.addEventListener("change", renderTransactions);

        async function loadAllExpenses() {
            try {
                const expenses = await fetchExpenses();
                allExpenses = [...expenses].reverse();

                const currentYear = new Date().getFullYear();
                const years = new Set([currentYear]);
                allExpenses.forEach(expense => {
                    const year = Number(String(expense.date || "").slice(0, 4));
                    if (Number.isInteger(year) && year > 0) {
                        years.add(year);
                    }
                });

                [...years].sort((first, second) => second - first).forEach(year => {
                    yearSelect.add(new Option(year, String(year)));
                });
                yearSelect.value = String(currentYear);

                renderTransactions();

            } catch (error) {
                console.error(error);
                list.innerText = "Unable to load transactions.";
            }
        }

        loadAllExpenses();
    </script>

</body>

</html>
