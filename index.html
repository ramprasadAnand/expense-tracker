<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            background: white;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: #007aff;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💰 Add Expense</h1>

        <div class="card">

            <!-- Amount -->
            <label>Amount</label>
            <input id="amount" type="number" inputmode="decimal" placeholder="₹ 0">

            <!-- Category -->
            <label>Category</label>
            <select id="category"></select>

            <!-- Sub Category -->
            <label>Sub-category</label>
            <select id="subCategory"></select>

            <!-- Date -->
            <label>Date</label>
            <input id="date" type="date">

            <!-- Note -->
            <label>Note</label>
            <textarea id="note" placeholder="Optional"></textarea>

            <!-- Submit -->
            <button id="submitButton" onclick="submitExpense()">
                Add Expense
            </button>

            <div id="message"></div>

        </div>

        <div class="card" style="margin-top: 20px;">

            <h2>Spending</h2>

            <div style="
                display: flex;
                justify-content: space-between;
                text-align: left;
            ">

                <div style="width: 50%;">
                    <div style="
                        font-size: 14px;
                        color: #777;
                    ">
                        Today
                    </div>

                    <div id="todayTotal" style="
                            font-size: 24px;
                            font-weight: 700;
                            margin-top: 5px;
                        ">
                        ₹0
                    </div>
                </div>

                <div style="width: 50%;">
                    <div style="
                        font-size: 14px;
                        color: #777;
                    ">
                        This Month
                    </div>

                    <div id="monthTotal" style="
                            font-size: 24px;
                            font-weight: 700;
                            margin-top: 5px;
                        ">
                        ₹0
                    </div>
                </div>

            </div>

        </div>

        <div class="card" style="margin-top: 20px;">

            <h2>Budget vs Actual</h2>

            <div id="budgetTracker">
                Loading...
            </div>

        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Recent Expenses</h2>
            <div id="expenseHistory">
                Loading...
            </div>
        </div>

    </div>


    <script>

        // =====================================================
        // GOOGLE APPS SCRIPT API
        // =====================================================

        const API_URL = "https://script.google.com/macros/s/AKfycbwi1wk_5LYnCVZLMLE67981LgmVxp-htonn2mVLyhys6LjC9tpb_NPgkhRVznvpHmxw/exec";


        // =====================================================
        // CATEGORY → SUB-CATEGORY
        // =====================================================

        const categories = {

            "Food": [
                "Office",
                "Street Food",
                "Restaurants",
                "Fast Food",
                "Cafes",
                "Snacks",
                "Food Delivery"
            ],

            "Grocery": [
                "Swiggy Instamart",
                "Blinkit",
                "Zepto",
                "BigBasket",
                "Amazon Fresh",
                "In Store"
            ],

            "Lifestyle Shopping": [
                "Amazon",
                "Myntra",
                "Flipkart",
                "Ajio",
                "Meesho",
                "Nykaa"
            ],

            "Car Fuel": [
                "Petrol",
                "Other"
            ],

            "Bike Fuel": [
                "Petrol",
                "Other"
            ],

            "Tolls": [
                "FASTag",
                "Other"
            ],

            "Parking": [
                "Office",
                "Shopping Mall",
                "Other"
            ],

            "Public Transport": [
                "Bus",
                "Metro",
                "Auto",
                "Cab",
                "Other"
            ],

            "Car Maintenance": [
                "Service",
                "Repair",
                "Washing / Cleaning",
                "Tyres / Battery",
                "Other"
            ],

            "Bike Maintenance": [
                "Service",
                "Repair",
                "Washing / Cleaning",
                "Tyres / Battery",
                "Other"
            ],

            "Household": [
                "Grocery",
                "Fruits & Vegetables",
                "Baby Essentials",
                "Electricity",
                "Gas",
                "Internet / Broadband",
                "TV / Cable",
                "Newspaper",
                "Other"
            ],

            "Household Maintenance": [
                "RO / Water Filter Service",
                "Geyser Service",
                "AC Service",
                "Washing Machine Service",
                "Refrigerator Service",
                "Plumbing",
                "Electrical",
                "Carpentry",
                "Pest Control",
                "Painting / Minor Repairs",
                "Other"
            ],

            "Health & Fitness": [
                "Medicines",
                "Fitness",
                "Health Insurance",
                "Other"
            ],

            "Family": [
                "Baby Essentials",
                "Schooling",
                "Other"
            ],

            "Entertainment": [
                "OTT",
                "Movies",
                "Events",
                "Other"
            ],

            "Home Loan": [
                "EMI",
                "Prepayment",
                "Other"
            ],

            "Investments": [
                "Mutual Funds",
                "Stocks",
                "Emergency Fund",
                "Other"
            ],

            "Insurance": [
                "Term Insurance",
                "Other Insurance",
                "Other"
            ],

            "Social & Giving": [
                "Donations",
                "Social Functions",
                "Offerings",
                "Other"
            ],

            "Other": [
                "Miscellaneous"
            ]
        };


        // =====================================================
        // INITIALIZE CATEGORY DROPDOWN
        // =====================================================

        const categorySelect =
            document.getElementById("category");

        const subCategorySelect =
            document.getElementById("subCategory");


        Object.keys(categories).forEach(category => {

            const option =
                document.createElement("option");

            option.value = category;
            option.textContent = category;

            categorySelect.appendChild(option);

        });


        // =====================================================
        // UPDATE SUB-CATEGORIES
        // =====================================================

        function updateSubCategories() {

            const category =
                categorySelect.value;

            subCategorySelect.innerHTML = "";

            categories[category].forEach(subCategory => {

                const option =
                    document.createElement("option");

                option.value = subCategory;
                option.textContent = subCategory;

                subCategorySelect.appendChild(option);

            });
        }


        categorySelect.addEventListener(
            "change",
            updateSubCategories
        );


        // =====================================================
        // DEFAULT DATE
        // =====================================================

        document.getElementById("date").value =
            new Date().toISOString().split("T")[0];


        // Initialize sub-category
        updateSubCategories();


        // =====================================================
        // SUBMIT EXPENSE
        // =====================================================

        async function submitExpense() {

            const amount =
                document.getElementById("amount").value;

            const category =
                categorySelect.value;

            const subCategory =
                subCategorySelect.value;

            const date =
                document.getElementById("date").value;

            const note =
                document.getElementById("note").value;


            // Validate amount

            if (!amount || Number(amount) <= 0) {

                document.getElementById("message").innerText =
                    "Please enter a valid amount.";

                return;
            }


            const data = {

                date: date,

                amount: Number(amount),

                category: category,

                subCategory: subCategory,

                note: note
            };


            const button =
                document.getElementById("submitButton");

            const message =
                document.getElementById("message");


            try {

                // Prevent double submission

                button.disabled = true;

                button.innerText = "Adding...";


                await fetch(API_URL, {

                    method: "POST",

                    headers: {

                        "Content-Type": "text/plain"
                    },

                    body: JSON.stringify(data)

                });


                message.innerText = "Expense added successfully ✓";

                // Clear amount and note
                document.getElementById("amount").value = "";
                document.getElementById("note").value = "";

                // Keep category, sub-category and date unchanged
                // Put cursor back in Amount
                document.getElementById("amount").focus();


            } catch (error) {

                console.error(error);

                message.innerText =
                    "Something went wrong. Please try again.";

            } finally {

                button.disabled = false;

                button.innerText = "Add Expense";

            }

        }

        function formatExpenseDate(dateValue) {

            const date = new Date(dateValue);

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function updateSpendingTotals(expenses) {

            const today = new Date();

            const todayString =
                today.toLocaleDateString("en-IN", {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                });

            const month = today.getMonth();
            const year = today.getFullYear();

            let todayTotal = 0;
            let monthTotal = 0;

            expenses.forEach(expense => {

                const expenseDate =
                    new Date(expense.date);

                const expenseAmount =
                    Number(expense.amount) || 0;

                const expenseDateString =
                    expenseDate.toLocaleDateString("en-IN", {
                        day: "2-digit",
                        month: "short",
                        year: "numeric"
                    });

                if (expenseDateString === todayString) {
                    todayTotal += expenseAmount;
                }

                if (
                    expenseDate.getMonth() === month &&
                    expenseDate.getFullYear() === year
                ) {
                    monthTotal += expenseAmount;
                }

            });

            document.getElementById("todayTotal").innerText =
                `₹${todayTotal.toLocaleString("en-IN")}`;

            document.getElementById("monthTotal").innerText =
                `₹${monthTotal.toLocaleString("en-IN")}`;
        }

        function updateBudgetTracker(expenses, budgets) {

            const tracker =
                document.getElementById("budgetTracker");

            const today = new Date();

            const currentMonth =
                today.getMonth();

            const currentYear =
                today.getFullYear();


            // Calculate spending by category
            const spendingByCategory = {};


            expenses.forEach(expense => {

                const expenseDate =
                    new Date(expense.date);

                if (
                    expenseDate.getMonth() === currentMonth &&
                    expenseDate.getFullYear() === currentYear
                ) {

                    const category =
                        expense.category;

                    const amount =
                        Number(expense.amount) || 0;

                    spendingByCategory[category] =
                        (spendingByCategory[category] || 0)
                        + amount;
                }

            });


            // Budget lookup
            const budgetMap = {};

            budgets.forEach(budget => {

                budgetMap[budget.category] =
                    Number(budget.monthlyBudget) || 0;

            });


            tracker.innerHTML = "";


            // Only show categories where money was spent
            Object.keys(spendingByCategory).forEach(category => {

                const spent =
                    spendingByCategory[category];

                const budget =
                    budgetMap[category] || 0;

                const percentage =
                    budget > 0
                        ? Math.round((spent / budget) * 100)
                        : 0;

                const width =
                    Math.min(percentage, 100);


                const item =
                    document.createElement("div");

                item.style.marginBottom = "20px";


                item.innerHTML = `

        <div style="
            display:flex;
            justify-content:space-between;
            font-weight:600;
        ">

            <span>${category}</span>

            <span>
                ₹${spent.toLocaleString("en-IN")}
                /
                ₹${budget.toLocaleString("en-IN")}
            </span>

        </div>


        <div style="
            height:8px;
            background:#e5e5e7;
            border-radius:10px;
            margin-top:8px;
            overflow:hidden;
        ">

            <div style="
                width:${width}%;
                height:100%;
                background:${percentage > 100
                                    ? "#ff3b30"
                                    : percentage >= 70
                                        ? "#ff9500"
                                        : "#34c759"
                                };
                border-radius:10px;
            "></div>

        </div>


        <div style="
            font-size:13px;
            color:#777;
            margin-top:5px;
        ">

            ${budget > 0
                        ? `${percentage}% used`
                        : "No budget set"
                    }

            ${spent > budget && budget > 0
                        ? ` · ₹${(spent - budget).toLocaleString("en-IN")} over budget`
                        : ""
                    }

        </div>
    `;


                tracker.appendChild(item);

            });

        }

        async function loadExpenses() {

            const history =
                document.getElementById("expenseHistory");

            try {

                const response = await fetch(API_URL);

                const data = await response.json();

                const expenses = data.expenses;
                const budgets = data.budgets;

                updateSpendingTotals(expenses);

                updateBudgetTracker(expenses, budgets);

                // Latest 5 expenses
                const recentExpenses =
                    expenses.slice(-5).reverse();

                history.innerHTML = "";

                recentExpenses.forEach(expense => {

                    const item =
                        document.createElement("div");

                    item.style.padding = "14px 0";
                    item.style.borderBottom =
                        "1px solid #eee";

                    item.innerHTML = `
            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
            ">

                <div>

                    <div style="
                        font-size:17px;
                        font-weight:600;
                    ">
                        ${expense.subCategory || expense.category || "Expense"}
                    </div>

                    <div style="
                        font-size:13px;
                        color:#777;
                        margin-top:4px;
                    ">
                        ${formatExpenseDate(expense.date)} · ${expense.category}
                    </div>

                    ${expense.note
                            ? `
                        <div style="
                            font-size:13px;
                            color:#777;
                            margin-top:4px;
                        ">
                            ${expense.note}
                        </div>
                        `
                            : ""
                        }

                </div>

                <div style="
                    font-size:18px;
                    font-weight:600;
                ">
                    ₹${expense.amount}
                </div>

            </div>
        `;

                    history.appendChild(item);

                });

            } catch (error) {

                console.error(error);

                history.innerText =
                    "Unable to load expenses.";
            }
        }

        // Load expenses when page opens
        loadExpenses();

    </script>

</body>

</html>
